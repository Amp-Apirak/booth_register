# One domain: /api + /socket.io -> server, everything else -> web
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: booth
  namespace: booth
spec:
  parentRefs:
    - { name: ingressgateway, namespace: istio-system, sectionName: https-booth }
  hostnames: ["${DOMAIN}"]
  rules:
    - matches:
        - path: { type: PathPrefix, value: /api }
        - path: { type: PathPrefix, value: /socket.io }
      backendRefs:
        - { name: booth-server, port: 3005 }
    - matches:
        - path: { type: PathPrefix, value: / }
      backendRefs:
        - { name: booth-client, port: 3000 }
---
# www.<domain> -> https://<domain>
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: booth-www
  namespace: booth
spec:
  parentRefs:
    - { name: ingressgateway, namespace: istio-system, sectionName: https-booth-www }
  hostnames: ["www.${DOMAIN}"]
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect: { hostname: "${DOMAIN}", scheme: https, statusCode: 301 }
---
# http -> https (ACME challenge routes use Exact paths, so they still win)
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: booth-http-redirect
  namespace: booth
spec:
  parentRefs:
    - { name: ingressgateway, namespace: istio-system, sectionName: http-booth }
    - { name: ingressgateway, namespace: istio-system, sectionName: http-booth-www }
  hostnames: ["${DOMAIN}", "www.${DOMAIN}"]
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect: { scheme: https, statusCode: 301 }
